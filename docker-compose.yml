# Run from the repo root. MLflow and Feast record absolute host paths (artifacts,
# offline Parquet files), so mlruns/ and data/ are also mounted at the same
# absolute path inside containers that need them (${PWD}/...).
# All ports bind to loopback only: nothing here has auth in local mode.
services:
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  app:
    build: .
    depends_on:
      redis: { condition: service_healthy }
    environment:
      REDIS_CONNECTION: redis:6379
      MLFLOW_TRACKING_URI: sqlite:///${PWD}/mlruns/mlflow.db
      MODEL_VARIANTS: ${MODEL_VARIANTS:-}
      DEFAULT_VARIANT: ${DEFAULT_VARIANT:-champion}  # falls back to the first variant without a registry
      FEATURE_CACHE: ${FEATURE_CACHE:-on}
      FEATURE_CACHE_TTL_S: ${FEATURE_CACHE_TTL_S:-300}
      RECSYS_ADMIN_TOKEN: ${RECSYS_ADMIN_TOKEN:-}  # set by the Makefile from .secrets/admin_token; empty disables /admin
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ./data:/app/data
      - ./mlruns:${PWD}/mlruns
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      retries: 40

  # ---- streaming (Phase 2): `make stream-up` -------------------------------
  kafka:
    image: apache/kafka:4.1.0
    profiles: [stream]
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://127.0.0.1:9092,DOCKER://kafka:29092  # IPv4: port is bound to 127.0.0.1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: -1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 3s
      retries: 40

  feature-server:
    build: .
    profiles: [stream]
    command: ["uvicorn", "recsys.streaming.feature_server:app", "--host", "0.0.0.0", "--port", "6566", "--no-access-log"]
    depends_on:
      redis: { condition: service_healthy }
    environment:
      REDIS_CONNECTION: redis:6379
    # Not published to the host: only Flink (inside the compose network) pushes
    # features, and /push accepts unauthenticated writes.
    volumes:
      - ./data:/app/data
      - ./data:${PWD}/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6566/health')"]
      interval: 3s
      retries: 40

  jobmanager:
    build: { context: ., dockerfile: docker/flink.Dockerfile }
    image: recsys-flink:2.2.1
    profiles: [stream]
    command: jobmanager
    # REST/UI port deliberately NOT published: Flink's REST API accepts job
    # submissions without auth (POST /jobs), which a DNS-rebinding web page could
    # reach on localhost. Tooling uses it from inside the container; for the
    # dashboard run `make flink-ui` (temporary loopback proxy).
    environment: &flink-env
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        python.executable: /opt/pyflink/bin/python
        python.client.executable: /opt/pyflink/bin/python
        python.fn-execution.bundle.size: 1000
        python.fn-execution.bundle.time: 5
        python.execution-mode: thread
        # No job upload/run/cancel over REST: the UI is reachable from the host's
        # browser, so a DNS-rebinding page could otherwise submit code. Jobs are
        # managed with the flink CLI inside the jobmanager container.
        web.submit.enable: false
        web.cancel.enable: false
        taskmanager.memory.process.size: 2048m
      KAFKA_BOOTSTRAP: kafka:29092
      FEATURE_SERVER_URL: http://feature-server:6566
      REDIS_URL: redis://redis:6379/0
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/overview"]
      interval: 3s
      retries: 40

  flink-ui:  # opt-in: `make flink-ui`, then http://localhost:8081
    image: alpine/socat:1.8.0.3
    profiles: [flink-ui]
    command: tcp-listen:8081,fork,reuseaddr tcp-connect:jobmanager:8081
    ports: ["127.0.0.1:8081:8081"]

  taskmanager:
    image: recsys-flink:2.2.1
    profiles: [stream]
    command: taskmanager
    depends_on: [jobmanager]
    environment: *flink-env
    volumes:
      - ./data/offline/user_stream:/opt/recsys-data/user_stream

  # ---- production loop (Phase 5): `make monitor-up` --------------------------
  mlflow:  # tracking server + model registry UI over the same SQLite store and artifacts
    build: .
    profiles: [monitor, registry]
    command: ["mlflow", "server", "--backend-store-uri", "sqlite:///${PWD}/mlruns/mlflow.db",
              "--default-artifact-root", "file://${PWD}/mlruns/artifacts", "--host", "0.0.0.0", "--port", "5000"]
    ports: ["127.0.0.1:5000:5000"]
    volumes:
      - ./mlruns:${PWD}/mlruns
    environment:
      MLFLOW_DISABLE_AGENT_HINT: "1"

  drift-exporter:
    build: .
    profiles: [monitor]
    command: ["python", "-m", "recsys.monitoring.exporter"]
    depends_on:
      redis: { condition: service_healthy }
    environment:
      REDIS_CONNECTION: redis:6379
      REDIS_URL_HOST: redis://redis:6379/0
      KAFKA_BOOTSTRAP_HOST: kafka:29092
      DRIFT_INTERVAL_S: "15"
    volumes:
      - ./data:/app/data

  prometheus:
    image: prom/prometheus:v3.11.3
    profiles: [monitor]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana:13.0.1
    profiles: [monitor]
    ports: ["127.0.0.1:3001:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-locally}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/recsys.json
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
