[project]
name = "recsys"
version = "0.1.0"
description = "Recommendation feature platform with online/offline consistency"
requires-python = ">=3.11,<3.12"
dependencies = [
  "feast[redis,duckdb]==0.67.0",
  "implicit==0.7.3",
  "lightgbm==4.7.0",
  "mlflow==3.18.0",
  "fastapi==0.162.0",
  "uvicorn==0.38.0",
  "httpx==0.28.1",
  "pandas",
  "pyarrow",
  "pyyaml",
  "pydantic>=2",
  "scipy",
  "numpy",
]

[dependency-groups]
batch = ["pyspark==4.3.0"]
dev = ["pytest==8.4.2"]
docs = ["playwright==1.64.1"]

[tool.uv]
default-groups = ["batch", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
