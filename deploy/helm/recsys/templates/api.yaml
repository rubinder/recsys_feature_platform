apiVersion: v1
kind: ServiceAccount
metadata:
  name: recsys
  # EKS: bound to a pod-scoped IAM role (lake + MLflow) via EKS Pod Identity (Terraform eks.tf)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {app: recsys-api}
spec:
  replicas: {{ .Values.replicas }}
  selector: {matchLabels: {app: recsys-api}}
  template:
    metadata:
      labels: {app: recsys-api}
      annotations: {prometheus.io/scrape: "true", prometheus.io/path: /metrics/, prometheus.io/port: "8000"}
    spec:
      serviceAccountName: recsys
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{containerPort: 8000, name: http}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          env:
            {{- include "recsys.env" . | nindent 12 }}
            {{- if .Values.adminTokenSecret }}
            - name: RECSYS_ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.adminTokenSecret | quote }}, key: token}}
            {{- end }}
          {{- include "recsys.envFrom" . | nindent 10 }}
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 90, periodSeconds: 15}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}  # model bundles are downloaded to a temp dir
            {{- if .Values.hostRoot }}
            - {name: data, mountPath: /app/data}
            - {name: mlruns, mountPath: "{{ .Values.hostRoot }}/mlruns", readOnly: true}
            {{- else }}
            - {name: data, mountPath: /app/data}  # impression logs (ephemeral in this deployment)
            {{- end }}
      volumes:
        - {name: tmp, emptyDir: {}}
        {{- if .Values.hostRoot }}
        - {name: data, hostPath: {path: "{{ .Values.hostRoot }}/data", type: Directory}}
        - {name: mlruns, hostPath: {path: "{{ .Values.hostRoot }}/mlruns", type: Directory}}
        {{- else }}
        - {name: data, emptyDir: {}}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  type: {{ .Values.service.type }}
  selector: {app: recsys-api}
  {{- if eq .Values.service.type "LoadBalancer" }}
  {{- if .Values.service.sourceRanges }}
  loadBalancerSourceRanges: {{- toYaml .Values.service.sourceRanges | nindent 4 }}
  {{- else if not .Values.service.allowPublic }}
  {{- fail "service.sourceRanges is required for a LoadBalancer (fail closed); set service.allowPublic=true to expose it to the internet on purpose" }}
  {{- end }}
  {{- end }}
  ports:
    - port: 80
      targetPort: http
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
