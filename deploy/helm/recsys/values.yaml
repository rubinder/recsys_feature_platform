image:
  repository: recsys-api
  tag: local
  pullPolicy: IfNotPresent

replicas: 2
hostRoot: ""            # absolute repo path (kind); empty on EKS (artifacts come from S3)
adminTokenSecret: ""    # name of a Secret with key `token` for /admin routes; empty = admin API disabled

api:
  defaultVariant: champion
  featureCacheTtlS: 300
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "2", memory: 2Gi}

service:
  type: NodePort        # kind maps nodePort 30080 -> localhost:8080; use LoadBalancer on EKS
  nodePort: 30080

redis:
  enabled: true         # in-cluster Redis (kind). On EKS set false and point at ElastiCache:
  external: ""          # e.g. "<primary-endpoint>:6379,ssl=true,password=<auth token>"

materialize:
  enabled: true         # post-install Job: Feast materialize into the in-cluster Redis
